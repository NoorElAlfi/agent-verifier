[project]
name = "agent-action-verifier"
version = "0.0.1"
description = "A risk-adaptive pre-commit gate for AI agents doing software operations."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-ulid>=3.0",
    "filelock>=3.13",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "httpx>=0.27",
    "mcp>=2.2.0",
    "inspect-ai>=0.3.272",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["av"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a running Docker daemon (Wave 2 C probes)",
]
